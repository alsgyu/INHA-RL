common:
  dt: 0.002
  joint_cnt: 22
  stiffness: [
    2, 2,
    5, 5, 5, 5,
    5, 5, 5, 5,
    100, 100, 100, 100, 50, 50,
    100, 100, 100, 100, 50, 50
  ]
  damping: [
    0.2, 0.2,
    0.5, 0.5, 0.5, 0.5,
    0.5, 0.5, 0.5, 0.5,
    2, 2, 2, 2, 1, 1,
    2, 2, 2, 2, 1, 1
  ]
  default_qpos: [
    0, 0,
    0.2, -1.35, 0, -0.5,
    0.2, 1.35, 0, 0.5,
    -0.2, 0, 0, 0.4, -0.25, 0,
    -0.2, 0, 0, 0.4, -0.25, 0
  ]
  torque_limit: [
    7, 7,
    10, 10, 10, 10,
    10, 10, 10, 10,
    30, 35, 20, 40, 20, 20,
    30, 35, 20, 40, 20, 20
  ]

policy:
  policy_path: "./models/velocity_command_walk_k1.pt"
  num_actions: 12
  num_observations: 54
  gait_frequency: 0.0
  command_source: "remote"
  command_slew_rate: 3.00
  startup_hold_s: 0.2
  startup_action_ramp_s: 3.0
  zero_command_hold_prepare: true
  zero_command_hold_threshold: 0.035
  rl_stance_transition_s: 2.0
  motion_start_hold_s: 0.0
  motion_start_action_ramp_s: 2.5
  deploy_action_clip: 0.65
  deploy_action_scale: 1.0
  deploy_default_qpos_source: "common"
  deploy_scale_actions_in_policy: false
  deploy_action_rate_limit: 0.0
  # Faster sagittal pitch/knee actions, slower lateral roll/yaw actions.
  deploy_action_rate_limit_by_index: [1.80, 0.35, 0.25, 2.00, 1.20, 0.30, 1.80, 0.35, 0.25, 2.00, 1.20, 0.30]
  rl_target_filter_alpha: 0.12
  # Action order: L hip pitch/roll/yaw, L knee, L ankle pitch/roll,
  #               R hip pitch/roll/yaw, R knee, R ankle pitch/roll.
  deploy_action_clip_by_index: [0.65, 0.20, 0.12, 0.65, 0.35, 0.18, 0.65, 0.20, 0.12, 0.65, 0.35, 0.18]
  deploy_action_scale_by_index: [1.00, 0.35, 0.25, 1.00, 0.45, 0.25, 1.00, 0.35, 0.25, 1.00, 0.45, 0.25]

  command_adapter:
    stand_command_threshold: 0.035
    gait_frequency_min: 1.30
    gait_frequency_max: 1.95
    gait_frequency_speed_min: 0.08
    gait_frequency_speed_max: 1.05
    max_yaw_speed_for_drive: 0.90
    foot_yaw_from_yaw_gain: 0.12
    foot_yaw_target_clip: [-0.22, 0.22]
    body_pitch_gain: 0.08
    body_pitch_target_clip: [-0.04, 0.12]
    body_roll_gain: -0.08
    body_roll_target_clip: [-0.08, 0.08]
    heading_correction_enabled: false
    heading_correction_min_abs_vx: 0.08
    heading_correction_max_abs_vy_command: 0.04
    heading_correction_max_abs_yaw_command: 0.08
    heading_correction_gain: 0.20
    heading_correction_deadband: 0.030
    heading_correction_max_yaw_rate: 0.08

  normalization:
    gravity: 1.0
    lin_vel: 1.0
    ang_vel: 1.0
    gait_frequency: 1.0
    foot_yaw: 1.0
    body_pitch_target: 1.0
    body_roll_target: 1.0
    feet_offset_x_target: 1.0
    feet_offset_y_target: 1.0
    dof_pos: 1.0
    dof_vel: 0.1
    clip_actions: 1.0

  control:
    action_scale: 1.
    decimation: 10

remote_control:
  max_vx: 0.50
  max_vy: 0.10
  max_vyaw: 0.30
  control_threshold: 0.035
  keyboard_step_vx: 0.10
  keyboard_step_vy: 0.05
  keyboard_step_vyaw: 0.05

mech:
  parallel_mech_indexes: [14, 15, 20, 21]
  parallel_mech_mode: "position"
  parallel_mech_prepare_mode: "position"
  parallel_mech_rl_mode: "position"

debug:
  enabled: true
  print_interval_s: 0.5

prepare:
  stiffness: [
    2, 2,
    5, 5, 5, 5,
    5, 5, 5, 5,
    80, 80, 80, 80, 50, 50,
    80, 80, 80, 80, 50, 50
  ]
  damping: [
    0.2, 0.2,
    0.5, 0.5, 0.5, 0.5,
    0.5, 0.5, 0.5, 0.5,
    1, 1, 1, 1, 2, 2,
    1, 1, 1, 1, 2, 2
  ]
  default_qpos: [
    0, 0,
    0.2, -1.35, 0, -0.5,
    0.2, 1.35, 0, 0.5,
    -0.1, 0, 0, 0.2, -0.1, 0,
    -0.1, 0, 0, 0.2, -0.1, 0
  ]
