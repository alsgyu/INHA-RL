common:
  dt: 0.002
  joint_cnt: 22
  joint_names: [
    "AAHead_yaw", "Head_pitch",
    "ALeft_Shoulder_Pitch", "Left_Shoulder_Roll", "Left_Elbow_Pitch", "Left_Elbow_Yaw",
    "ARight_Shoulder_Pitch", "Right_Shoulder_Roll", "Right_Elbow_Pitch", "Right_Elbow_Yaw",
    "Left_Hip_Pitch", "Left_Hip_Roll", "Left_Hip_Yaw", "Left_Knee_Pitch", "Left_Ankle_Pitch", "Left_Ankle_Roll",
    "Right_Hip_Pitch", "Right_Hip_Roll", "Right_Hip_Yaw", "Right_Knee_Pitch", "Right_Ankle_Pitch", "Right_Ankle_Roll"
  ]
  stiffness: [
    2, 2,
    5, 5, 5, 5,
    5, 5, 5, 5,
    100, 100, 100, 100, 120, 90,
    100, 100, 100, 100, 120, 90
  ]
  damping: [
    0.2, 0.2,
    0.5, 0.5, 0.5, 0.5,
    0.5, 0.5, 0.5, 0.5,
    2, 2.2, 2, 2, 4.0, 2.5,
    2, 2.2, 2, 2, 4.0, 2.5
  ]
  default_qpos: [
    0, 0,
    0.2, -1.35, 0, -0.5,
    0.2, 1.35, 0, 0.5,
    -0.2, 0, 0, 0.4, -0.25, 0,
    -0.2, 0, 0, 0.4, -0.25, 0
  ]
  torque_limit: [
    7, 7,
    10, 10, 10, 10,
    10, 10, 10, 10,
    30, 35, 20, 40, 20, 20,
    30, 35, 20, 40, 20, 20
  ]

policy:
  policy_path: "./models/velocity_command_walk_k1.pt"
  num_actions: 12
  num_observations: 54
  policy_joint_names: [
    "Left_Hip_Pitch", "Left_Hip_Roll", "Left_Hip_Yaw", "Left_Knee_Pitch", "Left_Ankle_Pitch", "Left_Ankle_Roll",
    "Right_Hip_Pitch", "Right_Hip_Roll", "Right_Hip_Yaw", "Right_Knee_Pitch", "Right_Ankle_Pitch", "Right_Ankle_Roll"
  ]
  gait_frequency: 0.0
  command_source: "remote"
  command_slew_rate: 3.00
  startup_hold_s: 0.2
  startup_action_ramp_s: 3.0
  zero_command_hold_prepare: true
  zero_command_hold_threshold: 0.055
  rl_stance_transition_s: 2.0
  motion_start_hold_s: 1.20
  motion_start_action_delay_s: 1.20
  motion_start_action_ramp_s: 4.0
  motion_start_command_delay_s: 1.20
  motion_start_command_ramp_s: 2.8
  deploy_action_clip: 0.85
  deploy_action_scale: 1.0
  deploy_default_qpos_source: "common"
  deploy_target_default_blend: 0.75
  deploy_scale_actions_in_policy: true
  deploy_action_rate_limit: 0.0
  # Keep yaw slow, but let hip/ankle roll react for balance.
  deploy_action_rate_limit_by_index: [4.0, 3.0, 0.5, 5.0, 4.0, 3.0, 4.0, 3.0, 0.5, 5.0, 4.0, 3.0]
  rl_publish_mode: "policy_step"
  rl_target_filter_alpha: 1.0
  policy_dof_vel_source: "finite_difference"
  policy_dof_vel_filter_alpha: 0.35
  policy_dof_vel_clip: 12.0
  # Action order: L hip pitch/roll/yaw, L knee, L ankle pitch/roll,
  #               R hip pitch/roll/yaw, R knee, R ankle pitch/roll.
  deploy_action_clip_by_index: [0.70, 0.35, 0.08, 0.75, 0.55, 0.28, 0.70, 0.35, 0.08, 0.75, 0.55, 0.28]
  deploy_action_scale_by_index: [0.85, 0.75, 0.20, 0.85, 0.80, 0.75, 0.85, 0.75, 0.20, 0.85, 0.80, 0.75]
  deploy_action_lower_by_index: [-0.60, -0.28, -0.04, -0.30, -0.45, -0.22, -0.60, -0.28, -0.04, -0.30, -0.45, -0.22]
  deploy_action_upper_by_index: [0.45, 0.28, 0.04, 0.56, 0.16, 0.22, 0.45, 0.28, 0.04, 0.56, 0.16, 0.22]

  command_adapter:
    stand_command_threshold: 0.035
    gait_frequency_min: 1.15
    gait_frequency_max: 1.95
    gait_frequency_speed_min: 0.08
    gait_frequency_speed_max: 1.05
    max_yaw_speed_for_drive: 0.90
    foot_yaw_from_yaw_gain: 0.12
    foot_yaw_target_clip: [-0.22, 0.22]
    body_pitch_gain: 0.0
    body_pitch_offset: 0.0
    body_pitch_target_clip: [-0.030, 0.030]
    body_roll_gain: -0.08
    body_roll_target_clip: [-0.08, 0.08]
    forward_pitch_vx_comp_enabled: true
    forward_pitch_vx_comp_deadband: 0.035
    forward_pitch_vx_comp_gain: 0.90
    forward_pitch_vx_comp_max: 0.085
    forward_pitch_vx_comp_min_vx: 0.038
    heading_correction_enabled: true
    heading_correction_min_abs_vx: 0.08
    heading_correction_max_abs_vy_command: 0.04
    heading_correction_max_abs_yaw_command: 0.08
    heading_correction_gain: 0.05
    heading_correction_deadband: 0.035
    heading_correction_max_yaw_rate: 0.015
  deploy_command_adapter_override:
    stand_command_threshold: 0.055
    body_pitch_offset: -0.006
    body_pitch_balance_gain: 0.35
    body_pitch_target_clip: [-0.030, 0.018]
    forward_pitch_vx_comp_deadband: 0.020
    forward_pitch_vx_comp_gain: 1.20
    forward_pitch_vx_comp_max: 0.140
    forward_pitch_vx_comp_min_vx: 0.030
    heading_correction_gain: 0.16
    heading_correction_deadband: 0.010
    heading_correction_max_yaw_rate: 0.08
    foot_yaw_from_yaw_gain: 0.14

  normalization:
    gravity: 1.0
    lin_vel: 1.0
    ang_vel: 1.0
    gait_frequency: 1.0
    foot_yaw: 1.0
    body_pitch_target: 1.0
    body_roll_target: 1.0
    feet_offset_x_target: 1.0
    feet_offset_y_target: 1.0
    dof_pos: 1.0
    dof_vel: 0.1
    clip_actions: 1.0

  control:
    action_scale: 1.
    decimation: 10

remote_control:
  max_vx: 0.50
  max_vy: 0.10
  max_vyaw: 0.30
  control_threshold: 0.035
  keyboard_step_vx: 0.05
  keyboard_step_vy: 0.05
  keyboard_step_vyaw: 0.05

mech:
  parallel_mech_indexes: [14, 15, 20, 21]
  parallel_mech_mode: "position"
  parallel_mech_prepare_mode: "position"
  parallel_mech_rl_mode: "position"

debug:
  enabled: true
  print_interval_s: 0.5

prepare:
  hold_current_on_custom: false
  transition_s: 2.5
  transition_dt_s: 0.02
  safety_abort_enabled: true
  safety_abort_pitch_abs: 0.18
  safety_abort_roll_abs: 0.35
  safety_abort_leg_error_abs: 0.35
  safety_abort_raw_leg_vel_abs: 4.0
  stiffness: [
    2, 2,
    5, 5, 5, 5,
    5, 5, 5, 5,
    80, 80, 80, 80, 120, 90,
    80, 80, 80, 80, 120, 90
  ]
  damping: [
    0.2, 0.2,
    0.5, 0.5, 0.5, 0.5,
    0.5, 0.5, 0.5, 0.5,
    1, 1, 1, 1, 4.5, 3.5,
    1, 1, 1, 1, 4.5, 3.5
  ]
  default_qpos: [
    0, 0,
    0.2, -1.35, 0, -0.5,
    0.2, 1.35, 0, 0.5,
    -0.04, 0, 0, 0.12, -0.09, 0,
    -0.04, 0, 0, 0.12, -0.09, 0
  ]
