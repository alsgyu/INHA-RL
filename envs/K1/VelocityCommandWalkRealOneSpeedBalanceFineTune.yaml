extends: VelocityCommandWalkRealOneSpeedGroundedFineTune.yaml

basic:
  task: "K1/Velocity_Command_Walk_K1"
  log_task: "K1/VelocityCommandWalkSIRLRealOneSpeedBalanceFineTune"
  checkpoint: "logs/K1/K1/VelocityCommandWalkSIRLRealSpeedRestartFineTune/2026-07-30-18-44-57/nn/model_24000.pth"
  max_iterations: 18000
  description: "Low-cadence restart from the best natural RestartFineTune checkpoint. Keep stand phase exact, avoid high swing-height shaping, hold 1.0 m/s near 1.5 Hz cadence, and use support/root-foot catch-up rewards for forward pitch and left drift."

env:
  num_envs: 256

runner:
  save_interval: 500
  progress_interval: 10

algorithm:
  sirl_worldmodel:
    collect_steps_per_iter: 192
    updates_per_iter: 1
    batch_size: 512
    actor_lr: 7.5e-8
    critic_lr: 2.0e-6
    collect_noise_std: 0.00010
    teacher_collect_iterations: 18000
    teacher_collect_decay_iterations: 18000
    teacher_collect_start_blend: 1.0
    teacher_collect_end_blend: 0.985
    teacher_collect_command_blend_enabled: true
    teacher_collect_low_speed_vx: 0.72
    teacher_collect_high_speed_vx: 1.06
    teacher_collect_high_speed_blend: 0.88
    teacher_distill_iterations: 18000
    teacher_distill_steps_per_iter: 4
    teacher_distill_replay_fraction: 0.97
    teacher_bc_coef: 150.0
    teacher_bc_decay_iterations: 18000
    teacher_bc_min_coef: 105.0
    teacher_bc_low_speed_vx: 0.72
    teacher_bc_high_speed_vx: 1.06
    teacher_bc_low_speed_weight: 100.0
    teacher_guard_max_mse: 0.0009
    teacher_guard_max_increase: 0.00004
    sirl_top_fraction: 0.08
    sirl_min_return_percentile: 62
    sirl_return_alpha: 1.3
    sirl_actor_coef: 0.004
    sirl_actor_start_iteration: 4500
    sirl_actor_warmup_iterations: 8000
    sirl_q_coef: 0.012
    sirl_fall_penalty: 35.0
    actor_rl_coef: 0.00006
    actor_rl_start_iteration: 4500
    actor_rl_warmup_iterations: 12000
    actor_mean_l2_coef: 0.140
    actor_action_l2_coef: 0.100
    actor_symmetry_coef: 0.010
    actor_symmetry_min_abs_vx: 1.25
    actor_symmetry_include_stand: true
    actor_symmetry_warmup_iterations: 12000
    sirl_metric_penalties:
      velocity_error: 2.6
      low_speed_overspeed: 7.0
      low_speed_lateral_instability: 5.5
      swing_clearance_deficit: 0.2
      swing_clearance_excess: 8.0
      no_foot_contact: 10.0
      support_front_lag: 9.0
      support_front_pitch_lag: 14.0
      swing_foot_forward_lag: 5.0
      root_feet_lateral_diff: 8.0
      swing_contact: 2.5
      swing_edge_contact: 2.4
      swing_pitch_asymmetry: 1.2
      contact_duty_asymmetry: 1.8
      right_contact_duty_excess: 5.0
      forward_push_asymmetry: 1.5
      right_forward_push_excess: 7.0
      forward_pitch_push: 10.0
      right_forward_pitch_push: 8.0
      forward_pitch_excess: 16.0
      move_start_forward_pitch: 12.0
      move_start_ankle_tracking: 8.0
      move_start_yaw_drift: 6.0
      move_start_support_front_lag: 12.0
      sustain_forward_pitch: 18.0
      sustain_forward_pitch_rate: 8.0
      sustain_right_forward_push: 9.0
      sustain_right_forward_pitch_push: 10.0
      sustain_ankle_tracking: 10.0
      sustain_yaw_drift: 8.0
      sustain_swing_clearance_excess: 11.0
      sustain_no_foot_contact: 14.0
      sustain_support_front_lag: 15.0
      sustain_support_front_pitch_lag: 20.0
      sustain_swing_foot_forward_lag: 9.0
      sustain_root_feet_lateral_diff: 12.0
      feet_slip: 1.2
      base_tilt: 5.2
      low_height: 1.2
      stand_drift: 3.4
      stop_transition_drift: 6.0

control:
  target_lag_alpha_by_index: [0.70, 0.62, 0.55, 0.70, 0.42, 0.52, 0.70, 0.62, 0.55, 0.70, 0.34, 0.48]

