  scales:
    orientation: -112.0
    ang_vel_xy: -0.85
    action_rate: -8.0
    feet_swing: 2.2
    swing_clearance: 4.0
    scuff_clearance: -48.0
    straight_phase_contact: 2.0
    straight_roll_tilt: -14.0
    straight_swing_edge_contact: -6.0
    straight_swing_foot_pitch: -0.45
    straight_swing_flat_contact: -3.6
    straight_swing_pitch_balance: -2.4
    straight_swing_foot_yaw: -0.60
    straight_swing_lateral_vel: -1.8
    straight_swing_roll_yaw_action: -0.36
    feet_slip: -6.5
    fast_stance_feet_xy_vel: -2.4
    straight_lateral_vel: -20.0
