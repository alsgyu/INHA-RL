    lin_vel_y: 0.0
    ang_vel_yaw: 0.0
  adapter:
    gait_frequency_min: 1.15
    gait_frequency_max: 1.54
    gait_frequency_speed_min: 0.08
    gait_frequency_speed_max: 0.50
    heading_correction_gain: 0.10
    heading_correction_max_yaw_rate: 0.020
  training_phases:
    - start_iteration: 0
      disturbance_scale: 0.00
      still_proportion: 0.48
      straight_proportion: 1.00
      high_speed_proportion: 0.00
      resampling_time_s: [5.0, 8.0]
      lin_vel_x: [0.04, 0.28]
      lin_vel_y: [0.0, 0.0]
      ang_vel_yaw: [0.0, 0.0]
      adapter:
        gait_frequency_max: 1.40
        gait_frequency_speed_max: 0.34
    - start_iteration: 3000
      disturbance_scale: 0.00
      still_proportion: 0.44
      straight_proportion: 1.00
      high_speed_proportion: 0.00
      resampling_time_s: [5.0, 8.0]
      lin_vel_x: [0.04, 0.36]
      lin_vel_y: [0.0, 0.0]
      ang_vel_yaw: [0.0, 0.0]
      adapter:
        gait_frequency_max: 1.48
        gait_frequency_speed_max: 0.42
    - start_iteration: 6000
      disturbance_scale: 0.00
      still_proportion: 0.40
      straight_proportion: 1.00
      high_speed_proportion: 0.00
      resampling_time_s: [5.0, 8.0]
      lin_vel_x: [0.05, 0.42]
      lin_vel_y: [0.0, 0.0]
      ang_vel_yaw: [0.0, 0.0]
      adapter:
        gait_frequency_max: 1.54
        gait_frequency_speed_max: 0.50

