extends: Parameter_Walk_K1.yaml

basic:
  log_task: "K1/ParameterWalkStableVx12Straight"
  description: "Fine-tune the stable b78a7 walk checkpoint for straight, low-slip vx tracking up to 1.2 m/s."

commands:
  still_proportion: 0.03
  straight_proportion: 0.92
  straight:
    lin_vel_x: [0.20, 1.20]
    lin_vel_y: 0.0
    ang_vel_yaw: 0.0
    gait_frequency: [1.25, 1.95]
    gait_frequency_by_lin_vel_x:
      min_speed: 0.20
      max_speed: 1.20
      min_frequency: 1.25
      max_frequency: 1.95
    foot_yaw_L: 0.0
    foot_yaw_R: 0.0
    body_pitch_target: 0.0
    body_roll_target: 0.0
    feet_offset_x_target: 0.0
    feet_offset_y_target: 0.0
  lin_vel_x: [-0.45, 1.25]
  lin_vel_y: [-0.12, 0.12]
  ang_vel_yaw: [-0.45, 0.45]
  gait_frequency: [1.15, 2.00]
  foot_yaw_L: [-0.10, 0.10]
  foot_yaw_R: [-0.10, 0.10]
  body_pitch_target: [-0.03, 0.10]
  feet_offset_x_target: [-0.04, 0.04]
  feet_offset_y_target: [-0.02, 0.05]
  resampling_time_s: [6.0, 10.0]
  training_phases:
    - start_iteration: 0
      disturbance_scale: 0.25
      resampling_time_s: [5.0, 8.0]
      straight:
        lin_vel_x: [0.20, 0.85]
      lin_vel_x: [0.20, 0.85]
      lin_vel_y: [-0.04, 0.04]
      ang_vel_yaw: [-0.15, 0.15]
      gait_frequency: [1.20, 1.75]
      foot_yaw_L: [-0.04, 0.04]
      foot_yaw_R: [-0.04, 0.04]
      body_pitch_target: [-0.01, 0.06]
      body_roll_target: [0.0, 0.0]
      feet_offset_x_target: [-0.02, 0.02]
      feet_offset_y_target: [-0.01, 0.03]
    - start_iteration: 3000
      disturbance_scale: 0.35
      resampling_time_s: [5.0, 9.0]
      straight:
        lin_vel_x: [0.20, 1.00]
      lin_vel_x: [0.20, 1.00]
      lin_vel_y: [-0.06, 0.06]
      ang_vel_yaw: [-0.25, 0.25]
      gait_frequency: [1.20, 1.85]
      foot_yaw_L: [-0.06, 0.06]
      foot_yaw_R: [-0.06, 0.06]
      body_pitch_target: [-0.02, 0.08]
      body_roll_target: [0.0, 0.0]
      feet_offset_x_target: [-0.03, 0.03]
      feet_offset_y_target: [-0.015, 0.04]
    - start_iteration: 7000
      disturbance_scale: 0.45
      resampling_time_s: [6.0, 10.0]
      straight:
        lin_vel_x: [0.25, 1.15]
      lin_vel_x: [0.25, 1.15]
      lin_vel_y: [-0.08, 0.08]
      ang_vel_yaw: [-0.35, 0.35]
      gait_frequency: [1.25, 1.95]
      foot_yaw_L: [-0.08, 0.08]
      foot_yaw_R: [-0.08, 0.08]
      body_pitch_target: [-0.03, 0.10]
      body_roll_target: [0.0, 0.0]
      feet_offset_x_target: [-0.035, 0.035]
      feet_offset_y_target: [-0.02, 0.045]
    - start_iteration: 12000
      disturbance_scale: 0.55
      resampling_time_s: [6.0, 11.0]
      straight:
        lin_vel_x: [0.30, 1.20]
      lin_vel_x: [0.30, 1.25]
      lin_vel_y: [-0.10, 0.10]
      ang_vel_yaw: [-0.45, 0.45]
      gait_frequency: [1.25, 2.00]
      foot_yaw_L: [-0.10, 0.10]
      foot_yaw_R: [-0.10, 0.10]
      body_pitch_target: [-0.03, 0.10]
      body_roll_target: [0.0, 0.0]
      feet_offset_x_target: [-0.04, 0.04]
      feet_offset_y_target: [-0.02, 0.05]

rewards:
  scales:
    tracking_lin_vel_x: 4.6
    tracking_lin_vel_y: 2.2
    tracking_ang_vel: 2.0
    lin_vel_x_error: -1.8
    heading_tracking: -22.0
    path_lateral: -18.0
    straight_path_lateral: -28.0
    straight_heading: -24.0
    straight_lateral_vel: -10.0
    straight_yaw_vel: -12.0
    feet_slip: -1.2
    stance_feet_xy_vel: -0.25
    fast_stance_feet_xy_vel: -0.55
    stance_feet_yaw: -0.25
    stance_feet_roll: -0.15
    action_rate: -3.8
  tracking_sigma: 0.13
  path_lateral_error_clip: 0.60
  straight_path_lateral_error_clip: 0.80
