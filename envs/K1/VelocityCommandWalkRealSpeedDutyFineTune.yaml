    teacher_collect_start_blend: 1.0
    teacher_collect_end_blend: 0.992
    teacher_distill_iterations: 6000
    teacher_distill_steps_per_iter: 3
    teacher_distill_replay_fraction: 0.85
    teacher_bc_coef: 46.0
    teacher_bc_decay_iterations: 6000
    teacher_bc_min_coef: 30.0
    teacher_bc_low_speed_vx: 0.55
    teacher_bc_high_speed_vx: 0.60
