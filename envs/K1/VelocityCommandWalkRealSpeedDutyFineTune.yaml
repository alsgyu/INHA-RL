    actor_mean_l2_coef: 0.055
    actor_action_l2_coef: 0.035
    actor_symmetry_coef: 0.150
    actor_symmetry_start_iteration: 0
    actor_symmetry_warmup_iterations: 3000
    sirl_metric_penalties:
      velocity_error: 2.5
      low_speed_overspeed: 6.0
      low_speed_lateral_instability: 4.5
      swing_contact: 5.0
      swing_edge_contact: 4.5
      swing_pitch_asymmetry: 4.0
      contact_duty_asymmetry: 5.0
      right_contact_duty_excess: 6.0
      feet_slip: 1.3
