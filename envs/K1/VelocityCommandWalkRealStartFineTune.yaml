extends: VelocityCommandWalkRealSpeedHighStabilityFineTune.yaml

basic:
  task: "K1/Velocity_Command_Walk_K1"
  log_task: "K1/VelocityCommandWalkSIRLRealStartFineTune"
  checkpoint: "logs/K1/K1/VelocityCommandWalkSIRLRealSpeedFinalFineTune/2026-07-31-00-03-33/nn/model_40000.pth"
  max_iterations: 24000
  description: "Real-start sim-to-real polish from the natural final-speed checkpoint. Match deploy's phase-0 W transition, train through ankle tracking lag seen on the robot, and reduce left-curving straight walk."

runner:
  save_interval: 1000
  progress_interval: 20

algorithm:
  sirl_worldmodel:
    actor_lr: 2.5e-7
    critic_lr: 5.0e-6
    collect_noise_std: 0.00045
    teacher_collect_iterations: 24000
    teacher_collect_decay_iterations: 24000
    teacher_collect_start_blend: 1.0
    teacher_collect_end_blend: 0.92
    teacher_collect_command_blend_enabled: true
    teacher_collect_low_speed_vx: 0.65
    teacher_collect_high_speed_vx: 0.95
    teacher_collect_high_speed_blend: 0.74
    teacher_distill_iterations: 24000
    teacher_distill_steps_per_iter: 3
    teacher_distill_replay_fraction: 0.90
    teacher_bc_coef: 88.0
    teacher_bc_decay_iterations: 24000
    teacher_bc_min_coef: 48.0
    teacher_bc_low_speed_vx: 0.65
    teacher_bc_high_speed_vx: 0.90
    teacher_bc_low_speed_weight: 38.0
    teacher_guard_max_mse: 0.0022
    teacher_guard_max_increase: 0.00014
    sirl_fall_penalty: 14.0
    actor_rl_coef: 0.00032
    actor_rl_start_iteration: 4000
    actor_rl_warmup_iterations: 20000
    actor_mean_l2_coef: 0.085
    actor_action_l2_coef: 0.060
    actor_symmetry_coef: 0.220
    actor_symmetry_warmup_iterations: 16000
    sirl_metric_penalties:
      velocity_error: 2.6
      low_speed_overspeed: 7.0
      low_speed_lateral_instability: 5.5
      swing_contact: 4.2
      swing_edge_contact: 3.8
      swing_pitch_asymmetry: 4.5
      contact_duty_asymmetry: 6.0
      right_contact_duty_excess: 7.0
      forward_push_asymmetry: 6.5
      right_forward_push_excess: 8.5
      forward_pitch_push: 10.0
      right_forward_pitch_push: 8.0
      forward_pitch_excess: 15.0
      move_start_forward_pitch: 10.0
      move_start_ankle_tracking: 8.0
      move_start_yaw_drift: 5.0
      feet_slip: 1.5
      swing_clearance_deficit: 0.8
      base_tilt: 4.5
      low_height: 1.0
      stand_drift: 3.0
      stop_transition_drift: 6.0

control:
  # Train-only actuator response model. It keeps deploy targets unchanged, but
  # exposes the policy to the ankle tracking lag seen in real debug logs.
  target_lag_alpha_by_index: [0.70, 0.62, 0.55, 0.70, 0.42, 0.52, 0.70, 0.62, 0.55, 0.70, 0.36, 0.48]

commands:
  randomize_gait_phase_on_start: false
  command_slew_rate: 1.8
  still_proportion: 0.56
  straight_proportion: 1.00
  high_speed_proportion: 0.00
  high_speed:
    lin_vel_x: [0.45, 0.58]
    lin_vel_y: 0.0
    ang_vel_yaw: 0.0
  lin_vel_x: [0.0, 0.65]
  lin_vel_y: [-0.015, 0.015]
  ang_vel_yaw: [-0.030, 0.030]
  straight:
    lin_vel_x: [0.04, 0.58]
    lin_vel_y: 0.0
    ang_vel_yaw: 0.0
  adapter:
    gait_frequency_min: 1.15
    gait_frequency_max: 1.72
    gait_frequency_speed_min: 0.08
    gait_frequency_speed_max: 0.70
    heading_correction_gain: 0.10
    heading_correction_deadband: 0.030
    heading_correction_max_yaw_rate: 0.024
  training_phases:
    - start_iteration: 0
      disturbance_scale: 0.00
      command_slew_rate: 1.8
      still_proportion: 0.64
      straight_proportion: 1.00
      high_speed_proportion: 0.00
      resampling_time_s: [2.0, 4.0]
      lin_vel_x: [0.04, 0.16]
      lin_vel_y: [0.0, 0.0]
      ang_vel_yaw: [0.0, 0.0]
      adapter:
        gait_frequency_max: 1.32
        gait_frequency_speed_max: 0.24
    - start_iteration: 5000
      disturbance_scale: 0.00
      command_slew_rate: 1.8
      still_proportion: 0.60
      straight_proportion: 1.00
      high_speed_proportion: 0.00
      resampling_time_s: [2.0, 4.5]
      lin_vel_x: [0.04, 0.28]
      lin_vel_y: [0.0, 0.0]
      ang_vel_yaw: [0.0, 0.0]
      adapter:
        gait_frequency_max: 1.42
        gait_frequency_speed_max: 0.36
    - start_iteration: 10000
      disturbance_scale: 0.00
      command_slew_rate: 1.7
      still_proportion: 0.56
      straight_proportion: 1.00
      high_speed_proportion: 0.02
      high_speed:
        lin_vel_x: [0.32, 0.45]
        lin_vel_y: 0.0
        ang_vel_yaw: 0.0
      resampling_time_s: [2.5, 5.0]
      lin_vel_x: [0.05, 0.42]
      lin_vel_y: [0.0, 0.0]
      ang_vel_yaw: [0.0, 0.0]
      adapter:
        gait_frequency_max: 1.55
        gait_frequency_speed_max: 0.50
    - start_iteration: 17000
      disturbance_scale: 0.00
      command_slew_rate: 1.7
      still_proportion: 0.52
      straight_proportion: 1.00
      high_speed_proportion: 0.04
      high_speed:
        lin_vel_x: [0.45, 0.58]
        lin_vel_y: 0.0
        ang_vel_yaw: 0.0
      resampling_time_s: [3.0, 5.5]
      lin_vel_x: [0.06, 0.58]
      lin_vel_y: [0.0, 0.0]
      ang_vel_yaw: [0.0, 0.0]
      adapter:
        gait_frequency_max: 1.68
        gait_frequency_speed_max: 0.64

randomization:
  dof_stiffness:
    range: [0.70, 1.10]
    operation: "scaling"
    distribution: "uniform"
  dof_damping:
    range: [0.80, 1.35]
    operation: "scaling"
    distribution: "uniform"
  dof_friction:
    range: [0.5, 5.0]
    operation: "additive"
    distribution: "uniform"
  base_com:
    range: [-0.035, 0.035]
    operation: "additive"
    distribution: "uniform"
  base_mass:
    range: [0.80, 1.20]
    operation: "scaling"
    distribution: "uniform"

rewards:
  scales:
    tracking_lin_vel_x: 2.6
    lin_vel_x_error: -2.8
    reactive_lin_vel_x_error: -0.3
    reactive_lin_vel_x_underspeed: -0.2
    lin_vel_x_overspeed: -26.0
    orientation: -190.0
    ang_vel_xy: -1.40
    action_rate: -11.0
    move_start_forward_pitch: -320.0
    move_start_ankle_pitch_tracking: -58.0
    move_start_yaw_drift: -10.0
    straight_ankle_pitch_tracking: -16.0
    straight_forward_pitch_excess: -260.0
    straight_forward_pitch_rate: -10.0
    straight_forward_push_balance: -13.0
    straight_right_forward_push_excess: -20.0
    straight_forward_pitch_push: -22.0
    straight_right_forward_pitch_push: -14.0
    straight_path_lateral: -10.0
    straight_heading: -8.5
    straight_lateral_vel: -28.0
    straight_yaw_vel: -36.0
  command_response_window_s: 0.7
  command_response_tau_s: 0.35
  command_response_min_abs_vx: 0.90
  move_start_window_s: 1.8
  move_start_min_target_norm: 0.045
  move_start_forward_pitch_threshold: 0.030
  move_start_yaw_vel_clip: 2.5
  ankle_pitch_tracking_error_clip: 0.24
  ankle_pitch_tracking_side_weights: [1.0, 1.25]
  straight_forward_pitch_threshold: 0.055
  forward_pitch_push_threshold: 0.035
  forward_push_asymmetry_deadband: 0.075
  right_forward_push_deadband: 0.045
  right_forward_pitch_push_deadband: 0.045

metadata:
  policy_name: "velocity_command_walk_k1_real_start_ft"
