  checkpoint: "logs/K1/K1/VelocityCommandWalkSIRLRealSpeedRestartFineTune/2026-07-30-18-44-57/nn/model_24000.pth"
  max_iterations: 26000
  description: "Restart from the best natural real-speed checkpoint and focus on grounded low/mid-speed walking, safe command-to-zero stops, and upright zero-command standing before extending speed again."

env:
