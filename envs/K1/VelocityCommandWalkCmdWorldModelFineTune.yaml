extends: VelocityCommandWalkCmdReactiveFineTune.yaml

basic:
  log_task: "K1/VelocityCommandWalkSIRLCmdWorldModelFineTune"
  max_iterations: 5000
  description: "Deploy-matched, conservative MBPO-style world-model fine-tune for K1 velocity command walking."

algorithm:
  sirl_worldmodel:
    model_rollout_enabled: true
    model_batch_ratio: 0.02
    model_batch_ratio_start: 0.0
    model_batch_ratio_final: 0.05
    model_batch_ratio_warmup_start_iteration: 3000
    model_batch_ratio_warmup_iterations: 1500
    model_batch_ratio_max: 0.08
    model_batch_ratio_min_accept_rate: 0.25
    model_loss_weight: 0.15
    model_teacher_guard_weight_multiplier: 1.50

    model_rollout_horizon: 1
    model_rollout_allow_multi_step: false
    model_rollout_starts: 524288
    model_rollout_min_wm_updates: 2500
    model_rollout_max_wm_loss: 5.0
    model_rollout_batch_size: 512
    model_rollout_ensemble_samples: 5

    model_delta_clip: 0.50
    model_reward_clip: 5.0
    model_done_threshold: 0.5
    model_done_filter_threshold: 0.5
    model_delta_norm_max: 2.0

    model_uncertainty_filter_enabled: true
    model_uncertainty_quantile: 0.55
    model_uncertainty_weight_enabled: true
    model_uncertainty_weight_floor: 0.35
    model_uncertainty_include_velocity: true

    model_low_speed_guard_enabled: true
    model_low_speed_vx: 0.35
    model_low_speed_max_pred_vx: 0.45

    store_privileged_replay: true
    world_model_ensemble_size: 5
    world_model_batch_size: 1024
    world_model_gradient_steps: 1
    world_model_lr: 1.0e-4
    world_model_velocity_head_enabled: true
    world_model_velocity_dim: 3
    world_model_velocity_privileged_start: 4
    world_model_velocity_coef: 0.25

commands:
  command_slew_rate: 3.0
  adapter:
    gait_frequency_min: 1.15
    gait_frequency_max: 1.95
    gait_frequency_speed_min: 0.08
    gait_frequency_speed_max: 1.05
    body_pitch_gain: 0.08
    body_pitch_target_clip: [-0.04, 0.12]
    heading_correction_enabled: false
    heading_correction_gain: 0.0
    heading_correction_max_yaw_rate: 0.0
  high_speed_proportion: 0.0
  high_speed:
    lin_vel_x: [1.20, 1.60]
    lin_vel_y: 0.0
    ang_vel_yaw: 0.0
  training_phases:
    - start_iteration: 0
      command_slew_rate: 3.0
      disturbance_scale: 0.02
      still_proportion: 0.16
      straight_proportion: 1.00
      resampling_time_s: [2.5, 4.5]
      lin_vel_x: [0.05, 0.80]
      lin_vel_y: [0.0, 0.0]
      ang_vel_yaw: [0.0, 0.0]
      adapter:
        gait_frequency_max: 1.95
        gait_frequency_speed_max: 1.05
        body_pitch_gain: 0.08
        body_pitch_target_clip: [-0.04, 0.12]
        heading_correction_enabled: false
        heading_correction_gain: 0.0
        heading_correction_max_yaw_rate: 0.0
    - start_iteration: 800
      command_slew_rate: 3.0
      disturbance_scale: 0.03
      still_proportion: 0.12
      straight_proportion: 1.00
      resampling_time_s: [1.8, 3.5]
      lin_vel_x: [0.05, 1.20]
      lin_vel_y: [0.0, 0.0]
      ang_vel_yaw: [0.0, 0.0]
      adapter:
        gait_frequency_max: 1.95
        gait_frequency_speed_max: 1.05
        body_pitch_gain: 0.08
        body_pitch_target_clip: [-0.04, 0.12]
        heading_correction_enabled: false
        heading_correction_gain: 0.0
        heading_correction_max_yaw_rate: 0.0
    - start_iteration: 2000
      command_slew_rate: 3.0
      disturbance_scale: 0.04
      still_proportion: 0.10
      straight_proportion: 0.96
      resampling_time_s: [1.6, 3.0]
      lin_vel_x: [0.05, 1.60]
      lin_vel_y: [-0.02, 0.02]
      ang_vel_yaw: [-0.05, 0.05]
      high_speed_proportion: 0.20
      high_speed:
        lin_vel_x: [1.20, 1.60]
        lin_vel_y: 0.0
        ang_vel_yaw: 0.0
      adapter:
        gait_frequency_max: 1.95
        gait_frequency_speed_max: 1.05
        body_pitch_gain: 0.08
        body_pitch_target_clip: [-0.04, 0.12]
        heading_correction_enabled: false
        heading_correction_gain: 0.0
        heading_correction_max_yaw_rate: 0.0
