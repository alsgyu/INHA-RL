extends: VelocityCommandWalkRealFineTune.yaml

basic:
  task: "K1/Velocity_Command_Walk_K1"
  log_task: "K1/VelocityCommandWalkSIRLRealSpeedLongFineTune"
  checkpoint: "logs/K1/K1/VelocityCommandWalkSIRLRealFineTune/2026-07-30-00-06-23/nn/model_8000.pth"
  max_iterations: 30000
  description: "Long conservative speed fine-tune from the real-safe model_8000 checkpoint, keeping 0.1-0.2 m/s stable before expanding to 1.0 m/s."

runner:
  save_interval: 1000
  progress_interval: 20

algorithm:
  sirl_worldmodel:
    learning_starts: 8192
    updates_per_iter: 1
    batch_size: 512
    actor_lr: 2.0e-6
    critic_lr: 1.0e-5
    collect_noise_std: 0.002
    load_optimizer_state: false
    load_critic_state: false
    load_world_model_state: false
    load_alpha_state: false
    teacher_enabled: true
    teacher_policy_path: "__checkpoint__"
    teacher_action_clip: 1.0
    teacher_collect_iterations: 24000
    teacher_collect_decay_iterations: 24000
    teacher_collect_start_blend: 1.0
    teacher_collect_end_blend: 0.82
    teacher_distill_iterations: 24000
    teacher_distill_steps_per_iter: 3
    teacher_distill_batch_size: 4096
    teacher_distill_replay_fraction: 0.6
    teacher_bc_coef: 18.0
    teacher_bc_decay_iterations: 24000
    teacher_bc_min_coef: 7.0
    teacher_bc_low_speed_vx: 0.28
    teacher_bc_high_speed_vx: 0.70
    teacher_bc_low_speed_weight: 8.0
    # Keep low-speed roll/yaw/ankle-roll close to the stable teacher; pitch joints adapt slowly.
    teacher_bc_action_weights: [0.55, 1.3, 1.4, 0.55, 0.45, 1.3, 0.55, 1.3, 1.4, 0.55, 0.45, 1.3]
    teacher_distill_action_weights: [0.65, 1.3, 1.4, 0.65, 0.55, 1.3, 0.65, 1.3, 1.4, 0.65, 0.55, 1.3]
    teacher_guard_enabled: true
    teacher_guard_action_weights: [0.45, 1.5, 1.6, 0.45, 0.40, 1.5, 0.45, 1.5, 1.6, 0.45, 0.40, 1.5]
    teacher_guard_max_mse: 0.010
    teacher_guard_max_increase: 0.0012
    actor_rl_coef: 0.002
    actor_rl_start_iteration: 6000
    actor_rl_warmup_iterations: 12000
    actor_mean_l2_coef: 0.020
    actor_action_l2_coef: 0.010
    actor_symmetry_coef: 0.020
    actor_symmetry_start_iteration: 4000
    actor_symmetry_warmup_iterations: 8000
    model_batch_ratio: 0.0
    model_rollout_enabled: false
    sirl_metric_penalties:
      velocity_error: 1.8
      feet_slip: 0.7
      swing_clearance_deficit: 0.7
      base_tilt: 1.4
      low_height: 0.8
      stand_drift: 1.5

control:
  # Less aggressive than the short speed run: enough pitch room for clearance, but low-speed stability remains bounded.
  action_clip_by_index: [0.78, 0.28, 0.05, 0.88, 0.64, 0.22, 0.78, 0.28, 0.05, 0.88, 0.64, 0.22]
  action_scale_by_index: [0.92, 0.60, 0.12, 0.92, 0.86, 0.60, 0.92, 0.60, 0.12, 0.92, 0.86, 0.60]
  action_lower_by_index: [-0.68, -0.23, -0.030, -0.32, -0.50, -0.18, -0.68, -0.23, -0.030, -0.32, -0.50, -0.18]
  action_upper_by_index: [0.50, 0.23, 0.030, 0.72, 0.24, 0.18, 0.50, 0.23, 0.030, 0.72, 0.24, 0.18]
  action_rate_limit_by_index: [4.5, 2.0, 0.35, 6.0, 4.5, 2.0, 4.5, 2.0, 0.35, 6.0, 4.5, 2.0]

commands:
  command_slew_rate: 2.5
  still_proportion: 0.35
  straight_proportion: 0.98
  lin_vel_x: [0.0, 1.05]
  lin_vel_y: [-0.04, 0.04]
  ang_vel_yaw: [-0.10, 0.10]
  straight:
    lin_vel_x: [0.04, 1.00]
    lin_vel_y: 0.0
    ang_vel_yaw: 0.0
  adapter:
    gait_frequency_min: 1.15
    gait_frequency_max: 1.95
    gait_frequency_speed_min: 0.08
    gait_frequency_speed_max: 1.00
    body_pitch_gain: 0.0
    body_pitch_offset: 0.0
    body_pitch_target_clip: [-0.030, 0.030]
    heading_correction_enabled: true
    heading_correction_min_abs_vx: 0.08
    heading_correction_gain: 0.04
    heading_correction_deadband: 0.040
    heading_correction_max_yaw_rate: 0.012
  training_phases:
    - start_iteration: 0
      disturbance_scale: 0.00
      still_proportion: 0.45
      straight_proportion: 1.00
      resampling_time_s: [5.0, 8.0]
      lin_vel_x: [0.04, 0.24]
      lin_vel_y: [0.0, 0.0]
      ang_vel_yaw: [0.0, 0.0]
      adapter:
        gait_frequency_max: 1.45
        gait_frequency_speed_max: 0.40
    - start_iteration: 6000
      disturbance_scale: 0.02
      still_proportion: 0.40
      straight_proportion: 1.00
      resampling_time_s: [5.0, 8.0]
      lin_vel_x: [0.04, 0.40]
      lin_vel_y: [0.0, 0.0]
      ang_vel_yaw: [0.0, 0.0]
      adapter:
        gait_frequency_max: 1.60
        gait_frequency_speed_max: 0.55
    - start_iteration: 12000
      disturbance_scale: 0.04
      still_proportion: 0.34
      straight_proportion: 1.00
      resampling_time_s: [5.0, 8.0]
      lin_vel_x: [0.05, 0.60]
      lin_vel_y: [0.0, 0.0]
      ang_vel_yaw: [0.0, 0.0]
      adapter:
        gait_frequency_max: 1.75
        gait_frequency_speed_max: 0.70
    - start_iteration: 20000
      disturbance_scale: 0.06
      still_proportion: 0.28
      straight_proportion: 0.98
      resampling_time_s: [5.0, 8.0]
      lin_vel_x: [0.06, 0.82]
      lin_vel_y: [-0.02, 0.02]
      ang_vel_yaw: [-0.05, 0.05]
      adapter:
        gait_frequency_max: 1.88
        gait_frequency_speed_max: 0.88
    - start_iteration: 27000
      disturbance_scale: 0.08
      still_proportion: 0.24
      straight_proportion: 0.96
      resampling_time_s: [5.0, 8.0]
      lin_vel_x: [0.08, 1.05]
      lin_vel_y: [-0.04, 0.04]
      ang_vel_yaw: [-0.10, 0.10]
      adapter:
        gait_frequency_max: 1.95
        gait_frequency_speed_max: 1.00

rewards:
  scales:
    tracking_lin_vel_x: 3.6
    lin_vel_x_error: -1.4
    orientation: -85.0
    ang_vel_xy: -0.45
    action_rate: -5.0
    feet_swing: 2.0
    swing_clearance: 4.0
    scuff_clearance: -34.0
    feet_slip: -5.0
    straight_path_lateral: -3.5
    straight_heading: -2.5
    straight_lateral_vel: -11.0
    straight_yaw_vel: -11.0
  swing_clearance_target: 0.130
  swing_clearance_sigma: 0.015
  scuff_clearance_threshold: 0.070

metadata:
  policy_name: "velocity_command_walk_k1_real_speed_long_ft"
