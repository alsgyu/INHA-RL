      forward_push_asymmetry: 5.0
      right_forward_push_excess: 6.5
      forward_pitch_excess: 12.0
      feet_slip: 1.2
      swing_clearance_deficit: 0.8
      base_tilt: 3.8
      low_height: 0.9
      stand_drift: 2.8
      stop_transition_drift: 6.0

