    teacher_bc_coef: 90.0
    teacher_bc_decay_iterations: 40000
    teacher_bc_min_coef: 55.0
    teacher_bc_low_speed_vx: 1.05
    teacher_bc_high_speed_vx: 1.35
    teacher_bc_low_speed_weight: 40.0
    teacher_guard_max_mse: 0.0025
    teacher_guard_max_increase: 0.00015
    sirl_fall_penalty: 12.0
    actor_rl_coef: 0.00025
    actor_rl_start_iteration: 12000
