    ang_vel_xy: -1.05
    action_rate: -9.0
    command_stand_still: -55.0
    command_stand_action: -6.0
    command_stand_default_pose: -12.0
    command_stand_feet_slip: -12.0
    stop_transition_drift: -38.0
