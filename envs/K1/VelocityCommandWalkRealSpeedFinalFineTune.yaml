      still_proportion: 0.46
      straight_proportion: 1.00
      high_speed_proportion: 0.05
      high_speed:
        lin_vel_x: [1.30, 1.50]
        lin_vel_y: 0.0
        ang_vel_yaw: 0.0
      resampling_time_s: [4.5, 8.0]
      lin_vel_x: [0.06, 1.50]
      lin_vel_y: [0.0, 0.0]
      ang_vel_yaw: [0.0, 0.0]
      adapter:
        gait_frequency_max: 2.18
        gait_frequency_speed_max: 1.50

