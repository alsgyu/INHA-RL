      still_proportion: 0.50
      straight_proportion: 1.00
      high_speed_proportion: 0.02
      high_speed:
        lin_vel_x: [0.95, 1.10]
        lin_vel_y: 0.0
        ang_vel_yaw: 0.0
      resampling_time_s: [4.5, 8.0]
      lin_vel_x: [0.05, 1.10]
      lin_vel_y: [0.0, 0.0]
      ang_vel_yaw: [0.0, 0.0]
      adapter:
        gait_frequency_max: 1.98
        gait_frequency_speed_max: 1.10
    - start_iteration: 16000
      disturbance_scale: 0.00
      command_slew_rate: 1.9
      still_proportion: 0.48
      straight_proportion: 1.00
      high_speed_proportion: 0.03
      high_speed:
