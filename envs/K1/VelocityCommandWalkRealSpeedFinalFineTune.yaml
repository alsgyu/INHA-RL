extends: VelocityCommandWalkRealSpeedRestartFineTune.yaml

basic:
  task: "K1/Velocity_Command_Walk_K1"
  log_task: "K1/VelocityCommandWalkSIRLRealSpeedFinalFineTune"
  checkpoint: "logs/K1/K1/VelocityCommandWalkSIRLRealSpeedRestartFineTune/2026-07-30-18-44-57/nn/model_24000.pth"
  max_iterations: 30000
  description: "Upright-preserving final speed/stop fine-tune from the strong restart checkpoint. Keep the current leg gait under a strong teacher guard, penalize forward trunk pitch explicitly, and expose 1.5 m/s only in the final curriculum phase."

runner:
  save_interval: 1000
  progress_interval: 20

algorithm:
  sirl_worldmodel:
    actor_lr: 3.0e-7
    critic_lr: 5.0e-6
    collect_noise_std: 0.0003
    teacher_collect_iterations: 30000
    teacher_collect_decay_iterations: 30000
    teacher_collect_start_blend: 1.0
    teacher_collect_end_blend: 0.97
    teacher_distill_iterations: 30000
    teacher_distill_steps_per_iter: 3
    teacher_distill_replay_fraction: 0.85
    teacher_bc_coef: 70.0
    teacher_bc_decay_iterations: 30000
    teacher_bc_min_coef: 35.0
    teacher_bc_low_speed_vx: 0.80
    teacher_bc_high_speed_vx: 1.30
    teacher_bc_low_speed_weight: 30.0
    teacher_guard_max_mse: 0.0035
    teacher_guard_max_increase: 0.00025
    sirl_fall_penalty: 10.0
    actor_rl_coef: 0.00035
    actor_rl_start_iteration: 10000
    actor_rl_warmup_iterations: 20000
    actor_mean_l2_coef: 0.060
    actor_action_l2_coef: 0.040
    actor_symmetry_coef: 0.150
    actor_symmetry_warmup_iterations: 16000
    sirl_metric_penalties:
      velocity_error: 2.8
      low_speed_overspeed: 6.0
      low_speed_lateral_instability: 4.5
      swing_contact: 4.0
      swing_edge_contact: 3.5
      swing_pitch_asymmetry: 4.0
      contact_duty_asymmetry: 5.0
      right_contact_duty_excess: 5.5
      forward_pitch_excess: 9.0
      feet_slip: 1.2
      swing_clearance_deficit: 0.8
      base_tilt: 3.2
      low_height: 0.9
      stand_drift: 2.8
      stop_transition_drift: 6.0

commands:
  command_slew_rate: 2.0
  still_proportion: 0.48
  straight_proportion: 1.00
  high_speed_proportion: 0.05
  high_speed:
    lin_vel_x: [1.30, 1.50]
    lin_vel_y: 0.0
    ang_vel_yaw: 0.0
  lin_vel_x: [0.0, 1.50]
  lin_vel_y: [-0.020, 0.020]
  ang_vel_yaw: [-0.04, 0.04]
  straight:
