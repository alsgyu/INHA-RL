extends: VelocityCommandWalkRealMidSpeedStraightFineTune.yaml

basic:
  task: "K1/Velocity_Command_Walk_K1"
  log_task: "K1/VelocityCommandWalkSIRLRealOneSpeedSustainFineTune"
  checkpoint: "logs/K1/K1/VelocityCommandWalkSIRLRealMidSpeedStraightFineTune/2026-07-31-13-06-28/nn/model_22000.pth"
  max_iterations: 9000
  description: "One-meter-per-second sustain polish from the mid-speed checkpoint. Capture the 3s forward-pitch fall with longer SIRL rollouts, keep <=0.7 m/s gait by teacher BC, and train a calmer 0.95-1.05 m/s limit cycle."

env:
  # The base K1 config defaults to one environment. Use enough parallel rollouts
  # that SIRL can choose trajectories that survive past the 3s failure window.
  num_envs: 256

runner:
  save_interval: 500
  progress_interval: 10

algorithm:
  sirl_worldmodel:
    collect_steps_per_iter: 192
    updates_per_iter: 1
    batch_size: 512
    actor_lr: 1.5e-7
    critic_lr: 3.0e-6
    collect_noise_std: 0.00025
    teacher_collect_iterations: 9000
    teacher_collect_decay_iterations: 9000
    teacher_collect_start_blend: 1.0
    teacher_collect_end_blend: 0.94
    teacher_collect_command_blend_enabled: true
    teacher_collect_low_speed_vx: 0.72
    teacher_collect_high_speed_vx: 1.02
    teacher_collect_high_speed_blend: 0.58
    teacher_distill_iterations: 9000
    teacher_distill_steps_per_iter: 3
    teacher_distill_replay_fraction: 0.94
    teacher_bc_coef: 105.0
    teacher_bc_decay_iterations: 9000
    teacher_bc_min_coef: 64.0
    teacher_bc_low_speed_vx: 0.72
    teacher_bc_high_speed_vx: 0.98
    teacher_bc_low_speed_weight: 70.0
    teacher_guard_max_mse: 0.0016
    teacher_guard_max_increase: 0.00008
    sirl_top_fraction: 0.10
    sirl_min_return_percentile: 55
    sirl_return_alpha: 1.2
    sirl_actor_coef: 0.020
    sirl_actor_start_iteration: 500
    sirl_actor_warmup_iterations: 3500
    sirl_q_coef: 0.040
    sirl_fall_penalty: 28.0
    actor_rl_coef: 0.00022
    actor_rl_start_iteration: 1200
    actor_rl_warmup_iterations: 7000
    actor_mean_l2_coef: 0.105
    actor_action_l2_coef: 0.075
    actor_symmetry_coef: 0.020
    actor_symmetry_min_abs_vx: 1.25
    actor_symmetry_include_stand: true
    actor_symmetry_warmup_iterations: 7000
    sirl_metric_penalties:
      velocity_error: 3.2
      low_speed_overspeed: 7.0
      low_speed_lateral_instability: 5.0
      swing_contact: 3.8
      swing_edge_contact: 3.4
      swing_pitch_asymmetry: 1.8
      contact_duty_asymmetry: 2.0
      right_contact_duty_excess: 7.5
      forward_push_asymmetry: 2.2
      right_forward_push_excess: 10.0
      forward_pitch_push: 11.0
      right_forward_pitch_push: 9.0
      forward_pitch_excess: 16.0
      move_start_forward_pitch: 6.0
      move_start_ankle_tracking: 5.0
      move_start_yaw_drift: 4.0
      sustain_forward_pitch: 18.0
      sustain_forward_pitch_rate: 8.0
      sustain_right_forward_push: 13.0
      sustain_right_forward_pitch_push: 12.0
      sustain_ankle_tracking: 9.0
      sustain_yaw_drift: 8.0
      feet_slip: 1.4
      swing_clearance_deficit: 0.8
      base_tilt: 5.5
      low_height: 1.2
      stand_drift: 3.0
      stop_transition_drift: 5.0

control:
  # Keep the train-only actuator response model. Slightly stronger right ankle
  # lag exposes the policy to the delayed right push seen near 1.0 m/s.
  target_lag_alpha_by_index: [0.70, 0.62, 0.55, 0.70, 0.40, 0.52, 0.70, 0.62, 0.55, 0.70, 0.30, 0.46]

commands:
  randomize_gait_phase_on_start: false
  command_slew_rate: 1.7
  still_proportion: 0.24
  straight_proportion: 1.00
  high_speed_proportion: 0.10
  high_speed:
    lin_vel_x: [0.98, 1.06]
    lin_vel_y: 0.0
    ang_vel_yaw: 0.0
  lin_vel_x: [0.0, 1.06]
  lin_vel_y: [-0.008, 0.008]
  ang_vel_yaw: [-0.018, 0.018]
  straight:
    lin_vel_x: [0.55, 1.04]
    lin_vel_y: 0.0
    ang_vel_yaw: 0.0
  resampling_time_s: [8.0, 12.0]
  adapter:
    gait_frequency_min: 1.15
    gait_frequency_max: 1.92
    gait_frequency_speed_min: 0.08
    gait_frequency_speed_max: 1.05
    heading_correction_gain: 0.05
    heading_correction_deadband: 0.035
    heading_correction_max_yaw_rate: 0.015
  training_phases:
    - start_iteration: 0
      disturbance_scale: 0.00
      command_slew_rate: 1.7
      still_proportion: 0.30
      straight_proportion: 1.00
      high_speed_proportion: 0.02
      high_speed:
        lin_vel_x: [0.88, 0.98]
        lin_vel_y: 0.0
        ang_vel_yaw: 0.0
      resampling_time_s: [8.0, 12.0]
      lin_vel_x: [0.45, 0.98]
      lin_vel_y: [0.0, 0.0]
      ang_vel_yaw: [0.0, 0.0]
      adapter:
        gait_frequency_max: 1.88
        gait_frequency_speed_max: 1.00
    - start_iteration: 2500
      disturbance_scale: 0.00
      command_slew_rate: 1.7
      still_proportion: 0.26
      straight_proportion: 1.00
      high_speed_proportion: 0.06
      high_speed:
        lin_vel_x: [0.94, 1.04]
        lin_vel_y: 0.0
        ang_vel_yaw: 0.0
      resampling_time_s: [8.0, 12.0]
      lin_vel_x: [0.50, 1.04]
      lin_vel_y: [0.0, 0.0]
      ang_vel_yaw: [0.0, 0.0]
      adapter:
        gait_frequency_max: 1.90
        gait_frequency_speed_max: 1.05
    - start_iteration: 6000
      disturbance_scale: 0.00
      command_slew_rate: 1.7
      still_proportion: 0.24
      straight_proportion: 1.00
      high_speed_proportion: 0.10
      high_speed:
        lin_vel_x: [0.98, 1.06]
        lin_vel_y: 0.0
        ang_vel_yaw: 0.0
      resampling_time_s: [9.0, 13.0]
      lin_vel_x: [0.55, 1.06]
      lin_vel_y: [0.0, 0.0]
      ang_vel_yaw: [0.0, 0.0]
      adapter:
        gait_frequency_max: 1.92
        gait_frequency_speed_max: 1.05

rewards:
  scales:
    tracking_lin_vel_x: 2.7
    lin_vel_x_error: -2.5
    reactive_lin_vel_x_error: -0.25
    reactive_lin_vel_x_underspeed: -0.20
    lin_vel_x_overspeed: -26.0
    orientation: -215.0
    ang_vel_xy: -1.65
    action_rate: -14.0
    move_start_forward_pitch: -240.0
    move_start_ankle_pitch_tracking: -45.0
    move_start_yaw_drift: -10.0
    straight_ankle_pitch_tracking: -18.0
    straight_forward_pitch_excess: -360.0
    straight_forward_pitch_rate: -14.0
    straight_forward_push_balance: -4.0
    straight_right_forward_push_excess: -26.0
    straight_forward_pitch_push: -32.0
    straight_right_forward_pitch_push: -24.0
    sustain_forward_pitch: -520.0
    sustain_forward_pitch_rate: -18.0
    sustain_right_forward_push_excess: -40.0
    sustain_right_forward_pitch_push: -34.0
    sustain_ankle_pitch_tracking: -24.0
    sustain_yaw_drift: -24.0
    straight_path_lateral: -20.0
    straight_heading: -18.0
    straight_lateral_vel: -36.0
    straight_yaw_vel: -56.0
    straight_contact_duty_balance: -2.5
    straight_right_contact_duty_excess: -9.0
    straight_swing_pitch_balance: -2.0
  straight_min_speed: 0.08
  straight_path_lateral_error_clip: 0.45
  straight_forward_pitch_threshold: 0.042
  straight_forward_pitch_rate_clip: 2.4
  forward_pitch_push_threshold: 0.028
  forward_push_asymmetry_deadband: 0.130
  right_forward_push_deadband: 0.035
  right_forward_pitch_push_deadband: 0.035
  sustain_min_vx: 0.88
  sustain_max_vx: 1.12
  sustain_min_command_age_s: 2.0
  sustain_forward_pitch_threshold: 0.032
  sustain_forward_pitch_rate_clip: 2.2
  sustain_forward_pitch_push_threshold: 0.026
  sustain_right_forward_push_deadband: 0.025
  sustain_yaw_vel_clip: 2.2
  contact_duty_deadband: 0.080
  right_contact_duty_deadband: 0.045
  ankle_pitch_tracking_error_clip: 0.24
  ankle_pitch_tracking_side_weights: [1.0, 1.40]

metadata:
  policy_name: "velocity_command_walk_k1_real_one_speed_sustain_ft"
