    teacher_collect_iterations: 20000
    teacher_collect_decay_iterations: 20000
    teacher_collect_start_blend: 1.0
    teacher_collect_end_blend: 0.88
    teacher_distill_iterations: 20000
    teacher_distill_steps_per_iter: 3
    teacher_distill_batch_size: 4096
    teacher_distill_replay_fraction: 0.70
