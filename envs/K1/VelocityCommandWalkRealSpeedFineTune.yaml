extends: VelocityCommandWalkRealFineTune.yaml

basic:
  task: "K1/Velocity_Command_Walk_K1"
  log_task: "K1/VelocityCommandWalkSIRLRealSpeedFineTune"
  checkpoint: "logs/K1/K1/VelocityCommandWalkSIRLRealFineTune/2026-07-30-00-06-23/nn/model_8000.pth"
  max_iterations: 10000
  description: "Speed expansion fine-tune from the real-safe model_8000 checkpoint, preserving low-speed walking while training up to 1.0 m/s."

runner:
  save_interval: 500
  progress_interval: 10

algorithm:
  sirl_worldmodel:
    learning_starts: 4096
    updates_per_iter: 1
    batch_size: 512
    actor_lr: 4.0e-6
    critic_lr: 2.0e-5
    collect_noise_std: 0.004
    load_optimizer_state: false
    load_critic_state: false
    load_world_model_state: false
    load_alpha_state: false
    teacher_enabled: true
    teacher_policy_path: "__checkpoint__"
    teacher_action_clip: 1.0
    teacher_collect_iterations: 7000
    teacher_collect_decay_iterations: 7000
    teacher_collect_start_blend: 1.0
    teacher_collect_end_blend: 0.62
    teacher_distill_iterations: 7000
    teacher_distill_steps_per_iter: 2
    teacher_distill_batch_size: 4096
    teacher_distill_replay_fraction: 0.5
    teacher_bc_coef: 8.0
    teacher_bc_decay_iterations: 7000
    teacher_bc_min_coef: 2.0
    teacher_bc_low_speed_vx: 0.25
    teacher_bc_high_speed_vx: 0.60
    teacher_bc_low_speed_weight: 4.0
    # Preserve low-speed roll/yaw behavior; let pitch joints adapt for larger stride and clearance.
    teacher_bc_action_weights: [0.25, 1.0, 1.0, 0.25, 0.20, 1.0, 0.25, 1.0, 1.0, 0.25, 0.20, 1.0]
    teacher_distill_action_weights: [0.35, 1.0, 1.0, 0.35, 0.30, 1.0, 0.35, 1.0, 1.0, 0.35, 0.30, 1.0]
    teacher_guard_enabled: true
    teacher_guard_action_weights: [0.20, 1.0, 1.0, 0.20, 0.18, 1.0, 0.20, 1.0, 1.0, 0.20, 0.18, 1.0]
    teacher_guard_max_mse: 0.018
    teacher_guard_max_increase: 0.003
    actor_rl_coef: 0.007
    actor_rl_start_iteration: 500
    actor_rl_warmup_iterations: 2500
    actor_mean_l2_coef: 0.010
    actor_action_l2_coef: 0.004
    actor_symmetry_coef: 0.020
    actor_symmetry_start_iteration: 500
    actor_symmetry_warmup_iterations: 2500
    model_batch_ratio: 0.0
    model_rollout_enabled: false
    sirl_metric_penalties:
      velocity_error: 1.6
      feet_slip: 0.6
      swing_clearance_deficit: 0.8
      base_tilt: 1.2
      low_height: 0.7
      stand_drift: 1.3

control:
  # Same real-deploy PD support, but pitch actions are less constrained for speed and foot clearance.
  action_clip_by_index: [0.85, 0.32, 0.06, 0.95, 0.70, 0.25, 0.85, 0.32, 0.06, 0.95, 0.70, 0.25]
  action_scale_by_index: [1.00, 0.65, 0.15, 1.00, 0.95, 0.65, 1.00, 0.65, 0.15, 1.00, 0.95, 0.65]
  action_lower_by_index: [-0.75, -0.25, -0.035, -0.35, -0.55, -0.20, -0.75, -0.25, -0.035, -0.35, -0.55, -0.20]
  action_upper_by_index: [0.55, 0.25, 0.035, 0.85, 0.30, 0.20, 0.55, 0.25, 0.035, 0.85, 0.30, 0.20]
  action_rate_limit_by_index: [6.0, 2.5, 0.4, 8.0, 6.0, 2.5, 6.0, 2.5, 0.4, 8.0, 6.0, 2.5]

commands:
  command_slew_rate: 3.0
  still_proportion: 0.25
  straight_proportion: 0.97
  lin_vel_x: [0.04, 1.05]
  lin_vel_y: [-0.04, 0.04]
  ang_vel_yaw: [-0.10, 0.10]
  straight:
    lin_vel_x: [0.05, 1.00]
    lin_vel_y: 0.0
    ang_vel_yaw: 0.0
  adapter:
    gait_frequency_min: 1.15
    gait_frequency_max: 2.05
    gait_frequency_speed_min: 0.08
    gait_frequency_speed_max: 1.00
    body_pitch_gain: 0.0
    body_pitch_offset: 0.0
    body_pitch_target_clip: [-0.030, 0.030]
    heading_correction_enabled: true
    heading_correction_min_abs_vx: 0.08
    heading_correction_gain: 0.05
    heading_correction_deadband: 0.035
    heading_correction_max_yaw_rate: 0.015
  training_phases:
    - start_iteration: 0
      disturbance_scale: 0.02
      still_proportion: 0.35
      straight_proportion: 1.00
      resampling_time_s: [5.0, 8.0]
      lin_vel_x: [0.04, 0.35]
      lin_vel_y: [0.0, 0.0]
      ang_vel_yaw: [0.0, 0.0]
      adapter:
        gait_frequency_max: 1.70
        gait_frequency_speed_max: 0.55
    - start_iteration: 1500
      disturbance_scale: 0.04
      still_proportion: 0.30
      straight_proportion: 1.00
      resampling_time_s: [5.0, 8.0]
      lin_vel_x: [0.05, 0.55]
      lin_vel_y: [0.0, 0.0]
      ang_vel_yaw: [0.0, 0.0]
      adapter:
        gait_frequency_max: 1.85
        gait_frequency_speed_max: 0.70
    - start_iteration: 3500
      disturbance_scale: 0.06
      still_proportion: 0.25
      straight_proportion: 0.98
      resampling_time_s: [5.0, 8.0]
      lin_vel_x: [0.06, 0.80]
      lin_vel_y: [-0.02, 0.02]
      ang_vel_yaw: [-0.05, 0.05]
      adapter:
        gait_frequency_max: 1.98
        gait_frequency_speed_max: 0.90
    - start_iteration: 6500
      disturbance_scale: 0.10
      still_proportion: 0.22
      straight_proportion: 0.95
      resampling_time_s: [5.0, 8.0]
      lin_vel_x: [0.08, 1.05]
      lin_vel_y: [-0.04, 0.04]
      ang_vel_yaw: [-0.10, 0.10]
      adapter:
        gait_frequency_max: 2.05
        gait_frequency_speed_max: 1.00

rewards:
  scales:
    tracking_lin_vel_x: 3.8
    lin_vel_x_error: -1.2
    orientation: -78.0
    ang_vel_xy: -0.35
    action_rate: -3.8
    feet_swing: 2.0
    swing_clearance: 4.0
    scuff_clearance: -32.0
    feet_slip: -4.5
    straight_path_lateral: -3.2
    straight_heading: -2.2
    straight_lateral_vel: -10.0
    straight_yaw_vel: -10.0
  swing_clearance_target: 0.125
  swing_clearance_sigma: 0.014
  scuff_clearance_threshold: 0.065

metadata:
  policy_name: "velocity_command_walk_k1_real_speed_ft"
