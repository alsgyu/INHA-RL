extends: VelocityCommandWalk.yaml

basic:
  task: "K1/Velocity_Command_Walk_K1"
  log_task: "K1/VelocityCommandWalkFastSAC"
  checkpoint: null
  headless: true
  sim_device: "cuda:0"
  rl_device: "cuda:0"
  max_iterations: 100000
  description: "Booster K1 velocity-command locomotion using the Holosoma FastSAC recipe. Only the robot environment/asset stays K1-specific."

env:
  num_envs: 4096

runner:
  save_interval: 1000
  progress_interval: 100
  use_wandb: false
  log_reward_terms: false

algorithm:
  fast_sac:
    num_learning_iterations: 100000
    critic_learning_rate: 3.0e-4
    actor_learning_rate: 3.0e-4
    alpha_learning_rate: 3.0e-4
    buffer_size: 1024
    num_steps: 1
    gamma: 0.97
    tau: 0.125
    batch_size: 8192
    learning_starts: 10
    policy_frequency: 4
    num_updates: 8
    target_entropy_ratio: 0.0
    num_atoms: 101
    v_min: -20.0
    v_max: 20.0
    critic_hidden_dim: 768
    actor_hidden_dim: 512
    use_symmetry: true
    alpha_init: 0.001
    use_autotune: true
    use_tanh: true
    log_std_max: 0.0
    log_std_min: -5.0
    compile: true
    obs_normalization: true
    use_layer_norm: true
    use_privileged_critic: true
    num_q_networks: 2
    max_grad_norm: 0.0
    amp: true
    amp_dtype: "bf16"
    weight_decay: 0.001
    save_interval: 1000
    logging_interval: 100
    checkpoint_replay: false
    load_replay_from_checkpoint: false
    save_replay_interval: 0
    save_final_replay: false
    max_replay_export_transitions: 1000000
    teacher_bc_coef: 0.0
    teacher_policy_path: null
    penalty_curriculum:
      enabled: true
      terms: [ang_vel_xy, orientation, action_rate]
      initial_scale: 0.5
      final_scale: 1.0
      warmup_steps: 30000

commands:
  training_mode: sampled
  curriculum: false
  still_proportion: 0.20
  straight_proportion: 0.0
  high_speed_proportion: 0.0
  command_slew_rate: 0.0
  lin_vel_x: [-1.0, 1.0]
  lin_vel_y: [-1.0, 1.0]
  ang_vel_yaw: [-1.0, 1.0]
  gait_frequency: [1.1, 1.9]
  foot_yaw_L: [0.0, 0.0]
  foot_yaw_R: [0.0, 0.0]
  body_pitch_target: [0.0, 0.0]
  body_roll_target: [0.0, 0.0]
  feet_offset_x_target: [0.0, 0.0]
  feet_offset_y_target: [0.0, 0.0]
  resampling_time_s: [10.0, 10.0]
  training_phases: []
  fixed:
    lin_vel_x: 0.0
    lin_vel_y: 0.0
    ang_vel_yaw: 0.0
  play:
    lin_vel_x: 0.4
    lin_vel_y: 0.0
    ang_vel_yaw: 0.0
    fixed_yaw: true
    no_disturbance: true

terrain:
  type: "trimesh"
  terrain_length: 8.0
  terrain_width: 8.0
  border_size: 40.0
  num_terrains: 20
  terrain_proportions: [0.20, 0.0, 0.60, 0.20]
  slope: 0.30
  random_height: 0.05
  discrete_height: 0.05
  horizontal_scale: 0.1
  vertical_scale: 0.005
  static_friction: 1.0
  dynamic_friction: 1.0
  restitution: 0.0

randomization:
  kick_interval_s: 7.5
  kick_lin_vel:
    range: [0.0, 1.0]
    operation: "additive"
    distribution: "gaussian"
  kick_ang_vel:
    range: [0.0, 0.0]
    operation: "additive"
    distribution: "gaussian"
  push_interval_s: 7.5
  push_duration_s: 0.25
  push_force:
    range: [0.0, 0.0]
    operation: "additive"
    distribution: "gaussian"
  push_torque:
    range: [0.0, 0.0]
    operation: "additive"
    distribution: "gaussian"
  dof_delay_steps:
    range: [0, 1]
    operation: "additive"
    distribution: "uniform"
  dof_stiffness:
    range: [0.90, 1.10]
    operation: "scaling"
    distribution: "uniform"
  dof_damping:
    range: [0.90, 1.10]
    operation: "scaling"
    distribution: "uniform"
  dof_friction:
    range: [0.0, 0.0]
    operation: "additive"
    distribution: "uniform"
  dof_torque_strength:
    range: [1.0, 1.0]
    operation: "scaling"
    distribution: "uniform"
  dof_torque_bias:
    range: [0.0, 0.0]
    operation: "additive"
    distribution: "uniform"
  friction:
    range: [0.10, 1.00]
    operation: "additive"
    distribution: "uniform"
  compliance:
    range: [0.5, 1.5]
    operation: "additive"
    distribution: "uniform"
  restitution:
    range: [0.0, 0.0]
    operation: "additive"
    distribution: "uniform"
  base_com:
    range: [0.0, 0.0]
    operation: "additive"
    distribution: "uniform"
  base_mass:
    range: [0.90, 1.20]
    operation: "scaling"
    distribution: "uniform"
  other_com:
    range: [0.0, 0.0]
    operation: "additive"
    distribution: "uniform"
  other_mass:
    range: [0.90, 1.20]
    operation: "scaling"
    distribution: "uniform"

rewards:
  scales:
    survival: 0.0
    tracking_lin_vel_x: 2.0
    tracking_lin_vel_y: 2.0
    tracking_ang_vel: 1.5
    lin_vel_x_error: 0.0
    lin_vel_y_error: 0.0
    ang_vel_yaw_error: 0.0
    heading_tracking: 0.0
    path_lateral: 0.0
    straight_path_lateral: 0.0
    straight_heading: 0.0
    straight_lateral_vel: 0.0
    straight_yaw_vel: 0.0
    base_height: 0.0
    foot_yaw_L: 0.0
    foot_yaw_R: 0.0
    orientation: -10.0
    torques: 0.0
    torque_tiredness: 0.0
    power: 0.0
    lin_vel_z: 0.0
    ang_vel_xy: -1.0
    dof_vel: 0.0
    dof_acc: 0.0
    root_acc: 0.0
    action_rate: -2.0
    dof_pos_limits: 0.0
    dof_vel_limits: 0.0
    torque_limits: 0.0
    collision: 0.0
    feet_slip: 0.0
    feet_vel_z: 0.0
    stance_feet_xy_vel: 0.0
    fast_stance_feet_xy_vel: 0.0
    stance_feet_yaw: 0.0
    stance_feet_roll: 0.0
    feet_yaw_diff: 0.0
    feet_yaw_mean: 0.0
    feet_roll: 0.0
    feet_pitch: 0.0
    feet_offset_x: 0.0
    feet_offset_y: 0.0
    feet_swing: 5.0
    swing_clearance: 0.0
    scuff_clearance: 0.0
    command_stand_still: 0.0
    command_stand_action: 0.0
    command_stand_default_pose: 0.0
    command_stand_feet_slip: 0.0
  only_positive_rewards: false
  tracking_sigma: 0.25
  swing_period: 0.22

metadata:
  policy_name: "velocity_command_walk_k1_fastsac"
  algorithm: "fast_sac"
  source_repo: "https://github.com/amazon-far/holosoma"
  source_experiment: "t1_29dof_fast_sac"
  paper: "Learning Sim-to-Real Humanoid Locomotion in 15 Minutes"
